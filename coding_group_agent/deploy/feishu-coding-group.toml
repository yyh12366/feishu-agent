default_permissions = "feishu-coding-group"
approval_policy = "never"
web_search = "disabled"
allow_login_shell = false

[shell_environment_policy]
inherit = "none"
set = { PATH = "/usr/bin:/bin:/usr/sbin:/sbin", GIT_CONFIG_NOSYSTEM = "1", GIT_CONFIG_GLOBAL = "/dev/null" }

[features]
hooks = false
browser_use = false
in_app_browser = false
skill_mcp_dependency_install = false

[permissions.feishu-coding-group]
extends = ":workspace"

[permissions.feishu-coding-group.network]
enabled = false

[permissions.feishu-coding-group.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"logs" = "deny"
"temp" = "deny"

[permissions.feishu-coding-group.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "deny"
":slash_tmp" = "deny"
