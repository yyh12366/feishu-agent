server {
    listen 80;
    listen [::]:80;
    server_name feishu-agent.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/feishu-codex;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name feishu-agent.example.com;
    ssl_certificate /etc/letsencrypt/live/feishu-agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feishu-agent.example.com/privkey.pem;

    location = /feishu/codex/events {
        client_max_body_size 1m;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        return 404;
    }
}
